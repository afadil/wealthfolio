id: EDGE-ROC-02
title: Under WAC a foreign return of capital pools the lots and both adjustments move the book cost at the day's rate
intent: >
  Rules R7.4, R7.2. A CAD account holds a USD asset bought at two USD/CAD
  rates under WAC. A return of capital pools the lots first, as a sale
  does, and reduces the pool: by its amount in USD and, at the day's rate,
  in CAD (the CRA converts the ACB at the rate in effect when a return of
  capital is received), realizing nothing while the pool covers it. A
  notional distribution adds cost in USD and, at the day's rate, in CAD,
  as a purchase is booked. The pool's acquisition rate stays what its
  purchases paid. A later sale relieves the pool's adjusted average. The
  gain is the value change.
policy: { base_currency: CAD, timezone: UTC, as_of: 2025-01-10 }
accounts:
  - { id: acc-1, currency: CAD, cost_basis_method: WAC }
assets:
  - { id: etf, quote_ccy: USD }
activities:
  - { id: dep-1, account: acc-1, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 4000 }
  - { id: buy-1, account: acc-1, type: BUY, date: 2025-01-03T10:00:00Z, asset: etf, quantity: 10, unit_price: 100, amount: 1000, fee: 0, currency: USD, fx_rate: 1.30 }
  - { id: buy-2, account: acc-1, type: BUY, date: 2025-01-06T10:00:00Z, asset: etf, quantity: 10, unit_price: 120, amount: 1200, fee: 0, currency: USD, fx_rate: 1.40 }
  - { id: roc-1, account: acc-1, type: ADJUSTMENT, subtype: RETURN_OF_CAPITAL, date: 2025-01-07T10:00:00Z, asset: etf, quantity: 0, unit_price: 0, amount: 100, currency: USD }
  - { id: nd-1, account: acc-1, type: ADJUSTMENT, subtype: NOTIONAL_DISTRIBUTION, date: 2025-01-07T11:00:00Z, asset: etf, quantity: 0, unit_price: 0, amount: 20, currency: USD }
  - { id: sell-1, account: acc-1, type: SELL, date: 2025-01-08T10:00:00Z, asset: etf, quantity: 5, unit_price: 130, amount: 650, fee: 0, currency: USD, fx_rate: 1.40 }
quotes:
  - { asset: etf, day: 2025-01-03, close: 100, currency: USD }
  - { asset: etf, day: 2025-01-06, close: 120, currency: USD }
  - { asset: etf, day: 2025-01-08, close: 130, currency: USD }
  - { asset: etf, day: 2025-01-10, close: 130, currency: USD }
fx_rates:
  - { from: USD, to: CAD, day: 2025-01-02, rate: 1.30 }
  - { from: USD, to: CAD, day: 2025-01-03, rate: 1.30 }
  - { from: USD, to: CAD, day: 2025-01-06, rate: 1.40 }
  - { from: USD, to: CAD, day: 2025-01-07, rate: 1.40 }
  - { from: USD, to: CAD, day: 2025-01-08, rate: 1.40 }
  - { from: USD, to: CAD, day: 2025-01-10, rate: 1.40 }
expected_notes: >
  buy-1: 10 etf, 1000 USD at 1.30 = 1300 CAD. buy-2: 10 etf, 1200 USD at
  1.40 = 1680 CAD. roc-1 pools them: 20 units, 2200 USD, 2980 CAD (rate
  2980 / 2200). It recovers 100 USD and 100 x 1.40 = 140 CAD: 2100 USD,
  2840 CAD; the pool covers it, so nothing is realized and no disposal row
  is written. nd-1 adds 20 USD and 20 x 1.40 = 28 CAD: 2120 USD, 2868 CAD,
  average 106 USD. The pool's purchase stays 2200 USD at 2980 CAD. sell-1
  takes 5 of 20: cost 530 USD, 717 CAD. Proceeds 650 USD at 1.40 = 910 CAD:
  P&L 120 USD, 193 CAD. Left: 15 units, 1590 USD, 2151 CAD. Cash 4000 -
  1300 - 1680 + 910 = 1930 CAD. Value 1930 + 15 x 130 x 1.40 = 4660, a gain
  of 660 CAD: income -140 + 28 = -112, realized 193, unrealized 2730 - 2151
  = 579.
