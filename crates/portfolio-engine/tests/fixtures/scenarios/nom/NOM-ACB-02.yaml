expected_notes: >
  buy-1: 100 units, ACB 1,000. Each of the five 200 returns of capital
  books 200 of cash, is no income, and reduces the ACB by 200: 800, 600,
  400, 200, 0, realizing nothing (the ACB covers each) and writing no
  disposal row. roc-may's 100 finds the ACB at zero: it is a capital gain,
  one disposal row with no units (proceeds 100, cost 0, P&L 100), and the
  ACB stays zero. The 100 units remain, at their purchase price of 10. Cash
  1,000 - 1,000 + 5 x 200 + 100 = 1,100. Value 1,100 + 100 x 1 = 1,200, a
  gain of 200: realized 100, unrealized 100 - 0 = 100, income 0.
