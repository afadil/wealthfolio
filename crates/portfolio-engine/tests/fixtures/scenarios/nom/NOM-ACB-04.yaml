id: NOM-ACB-04
title: The ACB is the pool's, so a return of capital reduces the average rather than each purchase
intent: >
  Rules R7.4, R7.2. Canada's ACB is the average cost of all identical units
  (the CRA: the average cost per unit of all units held). Under WAC a return
  of capital pools the purchases first, as a redemption does, and reduces
  the pool: one unit bought at 1 and one at 10, then a 4 return of capital,
  leave an ACB of 7 and realize nothing. Spreading it over each purchase
  would take the unit bought at 1 to zero and realize 1 while the ACB still
  covers the 4. A later return of capital beyond the ACB takes it to zero
  and the excess is a capital gain (a negative ACB is deemed one).
policy:
  base_currency: CAD
  timezone: UTC
  as_of: 2025-01-08
accounts:
  - id: acc-1
    name: Non-registered
