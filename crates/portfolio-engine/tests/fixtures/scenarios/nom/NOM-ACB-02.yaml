id: NOM-ACB-02
title: The CRA's negative ACB example, returns of capital beyond cost realize a capital gain
intent: >
  Rule R7.4. The CRA's "Tax treatment of mutual funds" example (RST Mutual
  Fund Trust): units bought for $1,000, a $200 return of capital in each of
  five years takes the ACB to zero, and a further $100 return of capital is
  a capital gain, because the ACB is already zero and a negative ACB is
  deemed a capital gain (the ACB stays zero). The returns of capital are
  cash distributions of capital (DIVIDEND, subtype RETURN_OF_CAPITAL), no
  income. The CRA's years are kept in order on consecutive days.
policy:
  base_currency: CAD
  timezone: UTC
  as_of: 2025-01-13
accounts:
  - id: acc-1
    name: Non-registered
    currency: CAD
    cost_basis_method: WAC
assets:
  - id: rst
    quote_ccy: CAD
activities:
  - { id: dep-1, account: acc-1, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 1000 }
  - { id: buy-1, account: acc-1, type: BUY, date: 2025-01-02T11:00:00Z, asset: rst, quantity: 100, unit_price: 10, amount: 1000, fee: 0 }
  - { id: roc-2016, account: acc-1, type: DIVIDEND, subtype: RETURN_OF_CAPITAL, date: 2025-01-03T10:00:00Z, asset: rst, quantity: 0, unit_price: 0, amount: 200 }
  - { id: roc-2017, account: acc-1, type: DIVIDEND, subtype: RETURN_OF_CAPITAL, date: 2025-01-06T10:00:00Z, asset: rst, quantity: 0, unit_price: 0, amount: 200 }
