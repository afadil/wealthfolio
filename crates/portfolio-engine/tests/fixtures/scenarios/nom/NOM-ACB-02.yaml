  - { id: roc-2019, account: acc-1, type: DIVIDEND, subtype: RETURN_OF_CAPITAL, date: 2025-01-08T10:00:00Z, asset: rst, quantity: 0, unit_price: 0, amount: 200 }
  - { id: roc-2020, account: acc-1, type: DIVIDEND, subtype: RETURN_OF_CAPITAL, date: 2025-01-09T10:00:00Z, asset: rst, quantity: 0, unit_price: 0, amount: 200 }
  - { id: roc-may, account: acc-1, type: DIVIDEND, subtype: RETURN_OF_CAPITAL, date: 2025-01-10T10:00:00Z, asset: rst, quantity: 0, unit_price: 0, amount: 100 }
