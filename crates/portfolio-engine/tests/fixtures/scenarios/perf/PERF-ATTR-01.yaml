  - { asset: aapl, day: 2025-01-08, close: 120 }
  - { asset: aapl, day: 2025-01-10, close: 125 }
fx_rates:
  - { from: USD, to: CAD, day: 2025-01-02, rate: 1.35 }
  - { from: USD, to: CAD, day: 2025-01-03, rate: 1.35 }
  - { from: USD, to: CAD, day: 2025-01-04, rate: 1.355 }
  - { from: USD, to: CAD, day: 2025-01-05, rate: 1.355 }
