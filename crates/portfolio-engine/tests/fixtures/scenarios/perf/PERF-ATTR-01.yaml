id: PERF-ATTR-01
title: Attribution reconciles with investment and cash FX effects
intent: >
  Base CAD. acc-1 is a CAD account trading a USD-quoted asset while USD/CAD
  drifts from 1.35 to 1.38; every attribution component is exercised:
  contributions, gross income with withholding tax, a standalone fee, trade
  fees on the buy and the sell (grossed up out of lot basis / disposal
  proceeds), realized P&L on a FIFO disposal and unrealized change. Legacy
  only separates investment fx_effect when the ACCOUNT currency differs
  from base, so acc-1 (CAD account, CAD base) keeps the position's FX drift
  folded into unrealized P&L. Cash FX is separately attributed by bucket.
  acc-2 is a USD account holding the same asset: there investment fx_effect
  = base unrealized change - local unrealized change x
  end FX. Both accounts also include the FX drift of their cash buckets,
  even when that amount falls below the reconciliation warning tolerance.
