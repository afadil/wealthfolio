id: NOM-ACB-01
title: The CRA's mutual fund ACB worked example under WAC, a return of capital included
intent: >
  Rules R7.2, R7.4. The CRA's "Tax treatment of mutual funds" example (XYZ
  Mutual Fund Trust, Chart 1, Recalculation of adjusted cost base): two
  purchases and two reinvested distributions build the ACB, a redemption of
  200 units relieves the average cost, then a reinvested capital gains
  distribution (T3 box 21) adds to it and a return of capital (T3 box 42)
  reduces it without moving units. In a CAD account with a CAD base, a WAC
  account's cost basis is the ACB. The CRA's dates (2018 to "this year") are
  kept in order on consecutive days; the rules do not depend on them.
policy:
  base_currency: CAD
  timezone: UTC
  as_of: 2025-01-13
accounts:
  - id: acc-1
    name: Non-registered
    currency: CAD
    cost_basis_method: WAC
assets:
  - id: xyz
    quote_ccy: CAD
activities:
  - { id: dep-1, account: acc-1, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 30000 }
  - { id: buy-1, account: acc-1, type: BUY, date: 2025-01-03T10:00:00Z, asset: xyz, quantity: 1355.9322, unit_price: 14.75, amount: 20000, fee: 0 }
  - { id: drip-1, account: acc-1, type: DIVIDEND, subtype: DRIP, date: 2025-01-06T10:00:00Z, asset: xyz, quantity: 87.0622, unit_price: 16.40, amount: 1427.82 }
  - { id: buy-2, account: acc-1, type: BUY, date: 2025-01-07T10:00:00Z, asset: xyz, quantity: 289.1845, unit_price: 17.29, amount: 5000, fee: 0 }
  - { id: drip-2, account: acc-1, type: DIVIDEND, subtype: DRIP, date: 2025-01-08T10:00:00Z, asset: xyz, quantity: 69.8700, unit_price: 13.77, amount: 962.11 }
  - { id: sell-1, account: acc-1, type: SELL, date: 2025-01-09T10:00:00Z, asset: xyz, quantity: 200, unit_price: 17.42, amount: 3414, fee: 70 }
  - { id: drip-3, account: acc-1, type: DIVIDEND, subtype: DRIP, date: 2025-01-10T10:00:00Z, asset: xyz, quantity: 50, unit_price: 15.00, amount: 750 }
  - { id: roc-1, account: acc-1, type: ADJUSTMENT, subtype: RETURN_OF_CAPITAL, date: 2025-01-10T12:00:00Z, asset: xyz, quantity: 0, unit_price: 0, amount: 500 }
quotes:
  - { asset: xyz, day: 2025-01-03, close: 14.75 }
  - { asset: xyz, day: 2025-01-06, close: 16.40 }
  - { asset: xyz, day: 2025-01-07, close: 17.29 }
  - { asset: xyz, day: 2025-01-08, close: 13.77 }
  - { asset: xyz, day: 2025-01-09, close: 17.42 }
  - { asset: xyz, day: 2025-01-10, close: 15.00 }
  - { asset: xyz, day: 2025-01-13, close: 15.00 }
expected_notes: >
  As Chart 1: buy-1 20,000.00 for 1,355.9322 units (average 14.75); drip-1
  +1,427.82 for 87.0622 units: 21,427.82, 1,442.9944 units (14.85); buy-2
  +5,000.00 for 289.1845 units: 26,427.82, 1,732.1789 units (15.26); drip-2
  +962.11 for 69.8700 units: 27,389.93, 1,802.0489 units (15.20). sell-1
  redeems 200 units at 17.42 (proceeds 3,484, fee 70) and pools the lots: it
  relieves 27,389.93 x 200 / 1,802.0489 = 3,039.87, a gain of 3,484 - 70 -
  3,039.87 = 374.13. The CRA multiplies the average rounded to the cent (200 x
  15.20 = 3,040.00, a gain of 374); the engine keeps the exact average, so
  from here its ACB is 0.13 above the chart's. Left 24,350.06 for 1,602.0489
  units. drip-3 adds 750.00 for 50 units; roc-1 pools the lots, as a sale
  does, and recovers 500.00 without moving units (the chart's net +250):
  24,600.06 for 1,652.0489 units, average 14.89 as in the chart (CRA
  24,599.93). The return of capital realizes nothing: the ACB covers it.
  Income: 1,427.82 + 962.11 + 750.00 reinvested, less the 500.00 return of
  capital. Cash 30,000 - 20,000 - 5,000 + 3,414 = 8,414.
